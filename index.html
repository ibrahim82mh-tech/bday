<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#100b10">
<title>haniya's birthday thing ★ by ibi</title>
<style>
:root{--bg:#100b10;--panel:#1b121a;--panel2:#24151f;--red:#d83d58;--pink:#f3b8c6;--cream:#f7eee9;--muted:#b8a4ad;--line:#55303d}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#4b1729 0,transparent 45%),var(--bg);color:var(--cream);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}button{font:inherit;cursor:pointer}.grain{position:fixed;inset:0;pointer-events:none;opacity:.07;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}
.wrap{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px 14px}.card{width:min(100%,680px);padding:clamp(22px,5vw,44px);background:linear-gradient(145deg,#21151e,#140e14 80%);border:1px solid var(--line);box-shadow:0 20px 90px #0008;position:relative;overflow:hidden;animation:enter .4s ease both}.card:before{content:'★';position:absolute;right:18px;top:8px;color:#8e3448;font-size:24px;transform:rotate(15deg)}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:13px;color:var(--muted);font-size:10px;letter-spacing:.2em;text-transform:uppercase}.brand{color:var(--pink);font-weight:bold}.stamp{display:inline-block;border:1px solid var(--red);color:var(--pink);padding:6px 9px;transform:rotate(-5deg);font-size:10px;letter-spacing:.13em}
.kicker{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--pink);margin-top:30px}h1{font-size:clamp(36px,8vw,65px);letter-spacing:-.055em;line-height:.98;margin:16px 0 12px;font-weight:900;text-transform:lowercase}h2{font-size:clamp(25px,5vw,38px);letter-spacing:-.04em;margin:12px 0}p{color:#d2c0c7;line-height:1.7;font-size:15px}.muted{color:var(--muted);font-size:12px}.hero-art{margin:26px auto 20px;width:min(100%,340px);aspect-ratio:1.2;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,#3c1a29,#120d12);border:1px solid #754051;overflow:hidden}.hero-art:before,.hero-art:after{content:'';position:absolute;border:1px solid #8e4254;transform:rotate(-18deg);width:130%;height:55%}.hero-art:after{transform:rotate(18deg);height:25%;border-color:#492331}.disc{width:120px;height:120px;border-radius:50%;background:repeating-radial-gradient(circle at center,#161016 0 5px,#3b2634 6px 7px,#171016 8px 13px);border:1px solid #875063;display:grid;place-items:center;z-index:1;box-shadow:0 0 40px #c53c5b26}.disc span{width:30px;height:30px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:white;font-size:9px;font-weight:bold}.art-label{position:absolute;bottom:12px;left:13px;font-size:9px;letter-spacing:.2em;color:#e7b5c1;z-index:2}.buttons{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:24px 0 4px}.btn{padding:12px 20px;border:1px solid #714050;background:transparent;color:var(--cream);transition:.18s}.btn:hover{transform:translateY(-2px);border-color:var(--pink)}.primary{background:var(--red);border-color:var(--red);color:white;font-weight:bold}.primary:hover{background:#b72f48}.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:25px 0}.track{display:flex;gap:13px;align-items:center;text-align:left;border:1px solid var(--line);padding:14px;margin:20px 0;background:#170f16}.track-cover{width:62px;height:62px;flex-shrink:0;background:linear-gradient(145deg,#5b1d32,#110b10);display:grid;place-items:center;border:1px solid #8c4055;color:var(--pink);font-size:23px}.track strong{display:block;font-size:14px;margin-bottom:5px}.track small{color:var(--muted);line-height:1.5}.music-link{display:inline-block;margin-top:9px;color:var(--pink);font-size:12px;text-decoration:none;border-bottom:1px solid #714050;padding-bottom:3px}.music-link:hover{color:white}.tag{display:inline-block;border:1px solid #714050;padding:6px 8px;color:var(--pink);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin:3px}.letter{padding:20px;border-left:2px solid var(--red);background:#160f15;text-align:left;white-space:pre-line;line-height:1.8;color:#e2d3d8;font-size:14px}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}.nav .btn{font-size:13px}.tiny{font-size:10px;color:#876d78;letter-spacing:.08em;margin-top:24px}.burst{position:fixed;z-index:5;top:-30px;animation:fall 2.8s linear forwards;pointer-events:none;color:var(--pink)}@keyframes fall{to{transform:translateY(110vh) rotate(500deg);opacity:0}}.nope{position:relative}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0}.mini{border:1px solid var(--line);padding:14px 6px;background:#1a1119;color:#d9c4cc;font-size:12px}.mini b{display:block;color:var(--pink);font-size:20px;margin-bottom:8px}.footer{font-size:10px;color:#806773;margin-top:24px}@media(max-width:440px){.nav{flex-direction:column-reverse}.nav .btn{width:100%}.mini-grid{gap:5px}.mini{font-size:11px;padding:12px 3px}.topline{font-size:9px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><div class="grain"></div><main class="wrap"><section class="card" id="app" aria-live="polite"></section></main>
<script>
const app=document.getElementById('app');let page=0;
const header=()=>`<div class="topline"><span class="brand">HANIYA.zip ★</span><span>made by ibi / 01</span><span class="stamp">ENGENE FILE</span></div>`;
const pages=[
()=>`${header()}<div class="kicker">i made you a birthday thing</div><div class="hero-art"><div class="disc"><span>H / 02</span></div><span class="art-label">PLAY THIS DAY LOUDER · SIDE A</span></div><span class="tag">for haniya only</span><h1>hey birthday girl.</h1><p>i actually made you a whole website for your birthday 😭 don't ask how long it took</p><p class="muted">no sponsors here, just me being extra</p><div class="divider"></div><h2>wanna see what i made?</h2><div class="buttons"><button class="btn primary" id="yes">okay YES ★</button><button class="btn nope" id="no">no thanks</button></div><div class="tiny">made by ibi. don't get emotional or anything 😭</div>`,
()=>`${header()}<div class="kicker">track 01 · birthday mode</div><h1>HANIYAAAAA</h1><p>HAPPY BIRTHDAYYY!! 🖤</p><div class="hero-art"><div class="disc"><span>HBD</span></div><span class="art-label">TODAY'S MAIN CHARACTER</span></div><p>hope you have the best day ever, with good food, no stress, nice people and way too many reasons to laugh.</p><div class="mini-grid"><div class="mini"><b>01</b>good food</div><div class="mini"><b>02</b>good people</div><div class="mini"><b>03</b>good music</div></div><div class="nav"><button class="btn" data-prev>← wait go back</button><button class="btn primary" data-next>next track →</button></div>`,
()=>`${header()}<div class="kicker">track 02 · your bias obviously</div><span class="tag">LEE HEESEUNG</span><h1>obviously this part is about your bias</h1><div class="track"><div class="track-cover">✦</div><div><strong>HANIYA'S HEESEUNG ZONE</strong><small>status: permanently living in your head<br>priority level: concerning (respectfully)</small></div></div><p>hope your birthday is as iconic as Evan, your playlist never misses, and your favourite fancams keep showing up on your feed 🫡</p><p class="muted">also HYBE what are you even doing 😭 the fans deserve better</p><div class="track"><div class="track-cover">♫</div><div><strong>soundtrack for this page</strong><small>tap below to play an ENHYPEN track on YouTube. your browser won't autoplay music without a click.</small><br><a class="music-link" href="https://www.youtube.com/results?search_query=ENHYPEN+official+audio" target="_blank" rel="noopener">▶ play ENHYPEN on YouTube ↗</a></div></div><div class="divider"></div><span class="tag">ENGENE APPROVED ★</span><div class="nav"><button class="btn" data-prev>← back</button><button class="btn primary" data-next>one more thing →</button></div>`,
()=>`${header()}<div class="kicker">track 03 · okay here's the actual message</div><h1>tiny birthday note</h1><div class="letter">Haniyaaa happy birthday!! 🖤

I hope this year brings you lots of good memories, fun little surprises, and people who make you feel loved and appreciated.

You're honestly so fun to be around and I hope you have the best day. Keep being yourself, keep liking what you like, keep being an ENHYPEN menace 😭 and please never become boring.

Anyway, this website proves I can actually be productive sometimes. Don't let it get to my head 💀

Have the best birthday ever, Haniya. You deserve it fr ♡

ibi ♡</div><div class="nav"><button class="btn" data-prev>← back</button><button class="btn primary" data-next>final level 🎉</button></div>`,
()=>`${header()}<div class="kicker">okay that's it · birthday complete</div><div class="hero-art"><div class="disc"><span>♥</span></div><span class="art-label">HANIYA'S DAY · REPLAY FOREVER</span></div><h1>and that's it lol</h1><p>happy birthday again Haniya!! go eat some cake and listen to ENHYPEN or do whatever you want 🖤</p><p class="muted">still side eyeing HYBE btw. from ibi</p><button class="btn primary" id="confetti">press for chaos ★</button><div class="divider"></div><span class="tag">friendship points +100</span><div class="nav"><button class="btn" data-prev>← read the note again</button><button class="btn" id="restart">replay ↻</button></div><div class="footer">not affiliated with ENHYPEN or BELIFT LAB, just a birthday gift from me.</div>`
];
function confetti(n=45){let chars=['★','♥','✦','✧','♡'];for(let i=0;i<n;i++){let e=document.createElement('span');e.className='burst';e.textContent=chars[Math.floor(Math.random()*chars.length)];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.6+'s';e.style.animationDuration=(1.7+Math.random()*1.8)+'s';document.body.append(e);setTimeout(()=>e.remove(),4000)}}
function render(){app.innerHTML=pages[page]();app.style.animation='none';void app.offsetWidth;app.style.animation='enter .4s ease both';document.getElementById('yes')?.addEventListener('click',()=>{page=1;render();confetti(30)});let no=document.getElementById('no');if(no){let n=0;no.addEventListener('click',()=>{n++;no.textContent=['are u sure 😭','HELLO???','this is so rude','fine click yes then'][Math.min(n-1,3)];no.style.transform=`translate(${Math.random()*48-24}px,${Math.random()*18-9}px)`;if(n>=4)no.onclick=()=>{page=1;render()}})}app.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>{page=Math.min(page+1,pages.length-1);render();if(page===4)confetti(35)}));app.querySelectorAll('[data-prev]').forEach(b=>b.addEventListener('click',()=>{page=Math.max(0,page-1);render()}));document.getElementById('confetti')?.addEventListener('click',()=>confetti(80));document.getElementById('restart')?.addEventListener('click',()=>{page=0;render()})}
render();
</script></body></html>
